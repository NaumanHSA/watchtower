[project]
name = "video-controller"
version = "0.1.0"
description = "Controller service for distributed video processing workers"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.6.0",
  "motor==3.6.0",
  "httpx==0.27.2",
  "python-json-logger==2.0.7",
]

[tool.uvicorn]
factory = false
host = "0.0.0.0"
port = 8000
log-level = "info"
