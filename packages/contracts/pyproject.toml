[project]
name = "watchtower-contracts"
version = "2.0.0"
description = "Wire contracts shared by the Watchtower controller, worker and token server"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
crypto = ["cryptography>=43"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
