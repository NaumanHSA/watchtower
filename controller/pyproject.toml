[project]
name = "watchtower-controller"
version = "2.0.0"
description = "Watchtower control plane: worker registry, stream scheduling and the dashboard API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "watchtower-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymongo>=4.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]

[project.scripts]
watchtower-controller = "watchtower_controller.__main__:main"

[tool.uv.sources]
watchtower-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchtower_controller"]
