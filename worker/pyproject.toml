[project]
name = "watchtower-worker"
version = "2.0.0"
description = "Watchtower worker: pulls assignments from the controller, detects faces on camera streams, delivers results"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "watchtower-contracts[crypto]",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.19",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=6.0",
]

[project.scripts]
watchtower-worker = "watchtower_worker.__main__:main"

[tool.uv.sources]
watchtower-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchtower_worker"]
