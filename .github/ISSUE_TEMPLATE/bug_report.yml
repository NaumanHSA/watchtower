name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems go through private reporting (see SECURITY.md), not here. Remove tokens, passwords and camera URLs from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: Steps, configuration (redacted), API calls
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Watchtower version or commit
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options: [controller, worker, token-server, dashboard, deployment/compose, docs]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
